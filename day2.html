     rows are defined with tr tag
     colums or cellls are defined with td dag

     attributes
     border = 1
     cell padding = 3 it creates sapce inside the cell
     cell spacing = 3 it creates sapce outside the cell
     width,height,border used to give size parameters for cell 

     how to add images
     absolute path
     <img width src="">

     relative path - local images
     <img width src="img.jpg">
    -->
     <table border="1" cellpadding="10" cellspacing="10" width="50%" height=""400px>
